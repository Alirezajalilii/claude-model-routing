<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1262" width="640" height="1262" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Saving per project against all-Opus and all-Sonnet</title>
  <desc id="chart-desc">Saving per project, two bars each, drawn from a zero line; a bar left of the line costs more than that baseline. P01 57.1% against all-Opus, 14.1% against all-Sonnet. P02 70.2% against all-Opus, 40.4% against all-Sonnet. P03 56.1% against all-Opus, 12.3% against all-Sonnet. P04 60.3% against all-Opus, 20.6% against all-Sonnet. P05 51.9% against all-Opus, 3.8% against all-Sonnet. P06 61.5% against all-Opus, 22.9% against all-Sonnet. P07 73.3% against all-Opus, 46.6% against all-Sonnet. P08 41.0% against all-Opus, -18.0% against all-Sonnet. P09 41.6% against all-Opus, -16.9% against all-Sonnet. P10 60.8% against all-Opus, 21.5% against all-Sonnet. P11 66.6% against all-Opus, 33.3% against all-Sonnet. 73.3% most saved against all-Opus (P07). 41.0% least saved against all-Opus (P08). -18.0% lowest against all-Sonnet (P08). Savings are subagent spend at list prices. Bars left of the line cost more.</desc>
