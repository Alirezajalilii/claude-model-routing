<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 648" width="640" height="648" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Agents by role and model family</title>
  <desc id="chart-desc">One stacked horizontal bar per role, split by model family. Scout: 139 Haiku, 98 Sonnet. Plan: 9 Sonnet, 57 Opus. Exec: 591 Haiku, 367 Sonnet. Verify: 288 Sonnet, 236 Opus. Segment colors: Haiku, Sonnet, Opus.</desc>
  <rect id="bg" x="0" y="0" width="640" height="648" rx="18" fill="#0f172a"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="48" font-size="28" font-weight="800" fill="#f8fafc">Haiku builds, Opus plans, Opus</text>
    <text x="40" y="86" font-size="28" font-weight="800" fill="#f8fafc">and Sonnet review</text>
    <text x="40" y="126" font-size="22" fill="#94a3b8">Agents by role and model family.</text>
    <rect x="40" y="152" width="18" height="18" rx="3" fill="#34d399"/>
    <text x="66" y="170" font-size="22" fill="#cbd5e1">Haiku</text>
    <rect x="162" y="152" width="18" height="18" rx="3" fill="#60a5fa"/>
    <text x="188" y="170" font-size="22" fill="#cbd5e1">Sonnet</text>
    <rect x="297" y="152" width="18" height="18" rx="3" fill="#a78bfa"/>
    <text x="323" y="170" font-size="22" fill="#cbd5e1">Opus</text>
    <text x="40" y="226" font-size="22" font-weight="700" fill="#f8fafc">Scout</text>
    <text x="600" y="226" font-size="22" font-weight="700" text-anchor="end" fill="#cbd5e1">237 agents</text>
    <rect id="mix-scout-haiku" x="40" y="236" width="82" height="28" rx="0" fill="#34d399" stroke="#0f172a" stroke-width="1"/>
    <rect id="mix-scout-sonnet" x="122" y="236" width="57" height="28" rx="0" fill="#60a5fa" stroke="#0f172a" stroke-width="1"/>
    <text x="40" y="294" font-size="22" fill="#cbd5e1">Haiku 139, Sonnet 98</text>
    <text x="40" y="336" font-size="22" font-weight="700" fill="#f8fafc">Plan</text>
    <text x="600" y="336" font-size="22" font-weight="700" text-anchor="end" fill="#cbd5e1">66 agents</text>
    <rect id="mix-plan-sonnet" x="40" y="346" width="5" height="28" rx="0" fill="#60a5fa" stroke="#0f172a" stroke-width="1"/>
    <rect id="mix-plan-opus" x="45" y="346" width="34" height="28" rx="0" fill="#a78bfa" stroke="#0f172a" stroke-width="1"/>
    <text x="40" y="404" font-size="22" fill="#cbd5e1">Sonnet 9, Opus 57</text>
    <text x="40" y="446" font-size="22" font-weight="700" fill="#f8fafc">Exec</text>
    <text x="600" y="446" font-size="22" font-weight="700" text-anchor="end" fill="#cbd5e1">958 agents</text>
    <rect id="mix-exec-haiku" x="40" y="456" width="345" height="28" rx="0" fill="#34d399" stroke="#0f172a" stroke-width="1"/>
    <rect id="mix-exec-sonnet" x="385" y="456" width="215" height="28" rx="0" fill="#60a5fa" stroke="#0f172a" stroke-width="1"/>
    <text x="40" y="514" font-size="22" fill="#cbd5e1">Haiku 591, Sonnet 367</text>
    <text x="40" y="556" font-size="22" font-weight="700" fill="#f8fafc">Verify</text>
    <text x="600" y="556" font-size="22" font-weight="700" text-anchor="end" fill="#cbd5e1">524 agents</text>
    <rect id="mix-verify-sonnet" x="40" y="566" width="168" height="28" rx="0" fill="#60a5fa" stroke="#0f172a" stroke-width="1"/>
    <rect id="mix-verify-opus" x="208" y="566" width="138" height="28" rx="0" fill="#a78bfa" stroke="#0f172a" stroke-width="1"/>
    <text x="40" y="624" font-size="22" fill="#cbd5e1">Sonnet 288, Opus 236</text>
  </g>
</svg>
