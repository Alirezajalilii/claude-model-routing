<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 518" width="640" height="518" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Median peak context by role</title>
  <desc id="chart-desc">Horizontal bars of median peak prompt tokens, in thousands: Scout 89K, Exec 89K, Verify 105K, Plan 375K, Main session 374K.</desc>
  <rect id="bg" x="0" y="0" width="640" height="518" rx="18" fill="#0f172a"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="48" font-size="28" font-weight="800" fill="#f8fafc">Most agents work in far less</text>
    <text x="40" y="86" font-size="28" font-weight="800" fill="#f8fafc">context</text>
    <text x="40" y="126" font-size="22" fill="#94a3b8">Median peak prompt tokens per agent, by</text>
    <text x="40" y="156" font-size="22" fill="#94a3b8">role, next to the main session.</text>
    <text x="40" y="204" font-size="22" font-weight="700" fill="#f8fafc">Scout</text>
    <text x="600" y="204" font-size="22" font-weight="700" text-anchor="end" fill="#fbbf24">89K</text>
    <rect id="ctx-scout" x="40" y="214" width="134" height="24" rx="4" fill="#f59e0b"/>
    <text x="40" y="268" font-size="22" font-weight="700" fill="#f8fafc">Exec</text>
    <text x="600" y="268" font-size="22" font-weight="700" text-anchor="end" fill="#fbbf24">89K</text>
    <rect id="ctx-exec" x="40" y="278" width="134" height="24" rx="4" fill="#f59e0b"/>
    <text x="40" y="332" font-size="22" font-weight="700" fill="#f8fafc">Verify</text>
    <text x="600" y="332" font-size="22" font-weight="700" text-anchor="end" fill="#fbbf24">105K</text>
    <rect id="ctx-verify" x="40" y="342" width="157" height="24" rx="4" fill="#f59e0b"/>
    <text x="40" y="396" font-size="22" font-weight="700" fill="#f8fafc">Plan</text>
    <text x="600" y="396" font-size="22" font-weight="700" text-anchor="end" fill="#fbbf24">375K</text>
    <rect id="ctx-plan" x="40" y="406" width="560" height="24" rx="4" fill="#f59e0b"/>
    <text x="40" y="460" font-size="22" font-weight="700" fill="#f8fafc">Main session</text>
    <text x="600" y="460" font-size="22" font-weight="700" text-anchor="end" fill="#c4b5fd">374K</text>
    <rect id="ctx-main" x="40" y="470" width="560" height="24" rx="4" fill="#a78bfa"/>
  </g>
</svg>
