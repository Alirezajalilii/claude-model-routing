    <text x="40" y="126" font-size="22" fill="#94a3b8">Savings are subagent spend at list</text>
    <text x="40" y="156" font-size="22" fill="#94a3b8">prices. Bars left of the line cost more.</text>
    <text x="40" y="200" font-size="22" fill="#fbbf24">73.3% most saved against all-Opus (P07)</text>
    <text x="40" y="230" font-size="22" fill="#c4b5fd">41.0% least saved against all-Opus (P08)</text>
    <text x="40" y="260" font-size="22" fill="#fda4af">-18.0% lowest against all-Sonnet (P08)</text>
